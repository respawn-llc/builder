version: v2
clean: true
inputs:
  - directory: api/proto
plugins:
  - local:
      - pnpm
      - --dir
      - apps
      - exec
      - protoc-gen-es
    out: apps/desktop/packages/server-api-contract/src/gen
    include_imports: true
    strategy: all
    opt:
      - target=ts
      - import_extension=js
      - valid_types=protovalidate_required+legacy_required
