syntax = "proto3";

package fixture;

import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";
import "kent/api/shared/foundation.proto";

option go_package = "core/shared/protoapi/gen/fixture;fixturepb";

message CreateSuccess {
  string resource_id = 1 [(buf.validate.field).string.min_len = 1];
}

message InvalidInputDetails {
  string field = 1 [(buf.validate.field).string.min_len = 1];
}

message ResourceConflictDetails {
  string resource_id = 1 [(buf.validate.field).string.min_len = 1];
}

message CreateError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    InvalidInputDetails invalid_input = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "invalid_input"
      }
    ];
    ResourceConflictDetails resource_conflict = 3 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "resource_conflict"
      }
    ];
  }
}

message CreateResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    CreateSuccess success = 1 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS
    ];
    CreateError error = 2 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR
    ];
  }
}

message WatchAcknowledgement {}

message WatchStartError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    InvalidInputDetails invalid_input = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "invalid_input"
      }
    ];
  }
}

message WatchStartResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    WatchAcknowledgement success = 1 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS
    ];
    WatchStartError error = 2 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR
    ];
  }
}

message WatchEvent {
  string value = 1 [(buf.validate.field).string.min_len = 1];
}

message WatchCompletion {
  uint32 event_count = 1;
}

service NamingService {
  rpc HTTP2Server(google.protobuf.Empty) returns (CreateResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_DEDICATED
      legacy_wire_name: "fixture.HTTP2Server"
    };
  }

  rpc Watch(google.protobuf.Empty) returns (WatchStartResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_SUBSCRIPTION
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_CLIENT_TO_SERVER
      event: {
        package: "fixture"
        service: "NamingService"
        method: "WatchEvent"
      }
      completion: {
        package: "fixture"
        service: "NamingService"
        method: "WatchComplete"
      }
      legacy_wire_name: "fixture.watch"
    };
  }

  rpc WatchEvent(.fixture.WatchEvent) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_SERVER_TO_CLIENT
      legacy_wire_name: "fixture.watch.event"
    };
  }

  rpc WatchComplete(.fixture.WatchCompletion) returns (google.protobuf.Empty) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_NOTIFICATION
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_SESSION_ACTIVE_PROJECT
      direction: DIRECTION_SERVER_TO_CLIENT
      legacy_wire_name: "fixture.watch.complete"
    };
  }

  rpc APIStatus(google.protobuf.Empty) returns (CreateResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_NONE
      scope_policy: SCOPE_POLICY_NONE
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED
      legacy_wire_name: "fixture.apiStatus"
    };
  }
}
