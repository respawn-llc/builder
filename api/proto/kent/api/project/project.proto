message PlanWorkspaceBindingRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  WorkspaceBindingPlanMode mode = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message PlanWorkspaceBindingSuccess {
  WorkspaceBindingPlanKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string canonical_root = 2 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability path_availability = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional ProjectBinding binding = 4;
  repeated ProjectSummary projects = 5;
  optional SelectedProjectWorkspace workspace = 6;

  option (buf.validate.message).cel = {
    id: "plan_workspace_binding.shape"
    message: "workspace binding plan fields do not match its kind"
    expression:
      "this.kind == 1 ? has(this.binding) && size(this.projects) == 0 && !has(this.workspace) : "
      "this.kind == 4 ? !has(this.binding) && size(this.projects) == 0 && has(this.workspace) : "
      "!has(this.binding) && !has(this.workspace)"
  };
}

message PlanWorkspaceBindingError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
  }
}

message PlanWorkspaceBindingResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    PlanWorkspaceBindingSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    PlanWorkspaceBindingError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message CreateProjectRequest {
  string display_name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
    },
    (buf.validate.field).cel = {
      id: "create_project.display_name"
      message: "display_name must be trimmed and contain no line break"
      expression: "this == this.trim() && !this.contains('\\r') && !this.contains('\\n')"
    }
  ];
  optional string project_key = 2 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.create.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
  string workspace_root = 3 [(buf.validate.field).string.min_len = 1];
}

message CreateProjectSuccess {
  ProjectMutationBinding binding = 1 [(buf.validate.field).required = true];
}

message CreateProjectError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    ProjectKeyConflictDetails project_key_conflict = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "project_key_conflict"
      }
    ];
    WorkspaceAlreadyBoundDetails workspace_already_bound = 3 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "workspace_already_bound"
      }
    ];
    WorkspacePathMissingDetails workspace_path_missing = 4 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "workspace_path_missing"
      }
    ];
    kent.api.shared.InternalFailureDetails internal_failure = 5 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
    AuthRequiredDetails auth_required = 6 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "auth_required"
      }
    ];
  }
}

message CreateProjectResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    CreateProjectSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    CreateProjectError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message ProjectWorkspaceListRequest {
  string project_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.(kent.api.shared.nonblank) = true,
    (buf.validate.field).string.(kent.api.shared.trimmed) = true
