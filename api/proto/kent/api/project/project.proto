message ResolvePathResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ResolvePathSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    ResolvePathError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
