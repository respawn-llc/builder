syntax = "proto3";

package kent.api.project;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/project;projectpb";

enum ProjectAvailability {
  PROJECT_AVAILABILITY_UNSPECIFIED = 0;
  PROJECT_AVAILABILITY_AVAILABLE = 1;
  PROJECT_AVAILABILITY_MISSING = 2;
  PROJECT_AVAILABILITY_INACCESSIBLE = 3;
  PROJECT_AVAILABILITY_UNLINKED = 4;
}

enum WorkspaceBindingPlanMode {
  WORKSPACE_BINDING_PLAN_MODE_UNSPECIFIED = 0;
  WORKSPACE_BINDING_PLAN_MODE_INTERACTIVE = 1;
  WORKSPACE_BINDING_PLAN_MODE_HEADLESS = 2;
}

enum WorkspaceBindingPlanKind {
  WORKSPACE_BINDING_PLAN_KIND_UNSPECIFIED = 0;
  WORKSPACE_BINDING_PLAN_KIND_BOUND = 1;
  WORKSPACE_BINDING_PLAN_KIND_LOCAL_UNBOUND = 2;
  WORKSPACE_BINDING_PLAN_KIND_SERVER_WORKSPACE_SELECTION = 3;
  WORKSPACE_BINDING_PLAN_KIND_HEADLESS_REMOTE_SELECTED = 4;
  WORKSPACE_BINDING_PLAN_KIND_HEADLESS_REMOTE_AMBIGUOUS = 5;
}

message ProjectSummary {
  string project_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "project_summary.project_id.trimmed"
      message: "project_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string project_key = 2 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.summary.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
  string display_name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
    },
    (buf.validate.field).cel = {
      id: "project_summary.display_name.trimmed"
      message: "display_name must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string root_path = 4 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability availability = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  int32 session_count = 6 [(buf.validate.field).int32.gte = 0];
  google.protobuf.Timestamp updated_at = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message ProjectWorkspaceSummary {
  string workspace_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "project_workspace_summary.workspace_id.trimmed"
      message: "workspace_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string display_name = 2;
  string root_path = 3 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability availability = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool is_primary = 5;
  int32 session_count = 6 [(buf.validate.field).int32.gte = 0];
  google.protobuf.Timestamp updated_at = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message ProjectOverview {
  ProjectSummary project = 1 [(buf.validate.field).required = true];
  repeated ProjectWorkspaceSummary workspaces = 2 [(buf.validate.field).repeated.max_items = 500];
}

message ProjectBinding {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string project_key = 2 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.binding.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
  string project_name = 3 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 4 [(buf.validate.field).string.min_len = 1];
  string canonical_root = 5 [(buf.validate.field).string.min_len = 1];
  string workspace_name = 6;
  ProjectAvailability workspace_status = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ProjectMutationBinding {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string project_key = 2 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.mutation_binding.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
  string project_name = 3 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 4 [(buf.validate.field).string.min_len = 1];
  string workspace_name = 5;
  ProjectAvailability workspace_status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message SelectedProjectWorkspace {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
}

message ProjectHomeWorkspaceSummary {
  string workspace_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "project_home_workspace_summary.workspace_id.trimmed"
      message: "workspace_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string display_name = 2;
  string root_path = 3 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability availability = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool is_primary = 5;
  google.protobuf.Timestamp updated_at = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message ProjectHomeSummary {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string project_key = 2 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.home_summary.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
  string display_name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
    },
    (buf.validate.field).cel = {
      id: "project_home_summary.display_name.trimmed"
      message: "display_name must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  ProjectHomeWorkspaceSummary primary_workspace = 4 [(buf.validate.field).required = true];
  optional string default_workflow_id = 5 [(buf.validate.field).string.min_len = 1];
  optional string default_workflow_name = 6 [(buf.validate.field).string.min_len = 1];
  bool default_workflow_valid = 7;
  google.protobuf.Timestamp updated_at = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
  int32 task_count = 9 [(buf.validate.field).int32.gte = 0];
  int32 attention_count = 10 [(buf.validate.field).int32.gte = 0];
  int32 workflow_count = 11 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "project_home_summary.default_workflow"
    message: "default workflow fields must be consistently present and valid"
    expression:
      "has(this.default_workflow_id) ? "
      "has(this.default_workflow_name) && this.default_workflow_valid : "
      "!has(this.default_workflow_name) && !this.default_workflow_valid"
  };
}

message ProjectWorkspaceCatalogSummary {
  string workspace_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.project.workspace_catalog_id_trimmed"
      message: "workspace_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string display_name = 2 [
    (buf.validate.field).cel = {
      id: "kent.project.workspace_catalog_display_name_trimmed"
      message: "display_name must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  string root_path = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.project.workspace_catalog_root_path_trimmed"
      message: "root_path must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  bool is_default = 4;

  option (buf.validate.message).cel = {
    id: "kent.project.workspace_catalog_display_name_nonblank"
    message: "display_name must not be blank for a non-root workspace"
    expression:
      "this.display_name != '' || this.root_path == '/' || "
      "(size(this.root_path) == 3 && this.root_path.charAt(1) == ':' && "
      "this.root_path.charAt(2) in ['/', '\\\\'] && "
      "((this.root_path.charAt(0) >= 'a' && this.root_path.charAt(0) <= 'z') || "
      "(this.root_path.charAt(0) >= 'A' && this.root_path.charAt(0) <= 'Z'))) || "
      "(this.root_path.startsWith('//') && "
      "size(this.root_path.substring(2).split('/').filter(part, part != '')) == 2) || "
      "(this.root_path.startsWith('\\\\\\\\') && "
      "size(this.root_path.substring(2).split('\\\\').filter(part, part != '')) == 2)"
  };
}

message ProjectNotFoundDetails {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ProjectUnavailableDetails {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string root_path = 2 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability availability = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message WorkspaceNotRegisteredDetails {
  optional string project_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  optional string workspace_root = 3 [(buf.validate.field).string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "workspace_not_registered.identity"
    message: "at least one workspace lookup identity must be present"
    expression: "has(this.project_id) || has(this.workspace_id) || has(this.workspace_root)"
  };
}

message WorkspaceBindingAmbiguousDetails {
  string canonical_root = 1 [(buf.validate.field).string.min_len = 1];
  repeated string project_ids = 2 [(buf.validate.field).repeated = {
    min_items: 2
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message WorkspaceBindingAmbiguousMutationDetails {
  repeated string project_ids = 1 [(buf.validate.field).repeated = {
    min_items: 2
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message WorkspacePathIdentityDetails {
  string workspace_root = 1 [(buf.validate.field).string.min_len = 1];
}

message ProjectKeyConflictDetails {
  string project_key = 1 [
    (buf.validate.field).string = {
      min_len: 2
      max_len: 8
    },
    (buf.validate.field).cel = {
      id: "kent.project.key_conflict.project_key"
      message: "project_key must start with A-Z and contain only A-Z or 0-9"
      expression:
        "this.charAt(0) >= 'A' && this.charAt(0) <= 'Z' && "
        "[0, 1, 2, 3, 4, 5, 6, 7].all(index, index >= size(this) || "
        "(this.charAt(index) >= 'A' && this.charAt(index) <= 'Z') || "
        "(this.charAt(index) >= '0' && this.charAt(index) <= '9'))"
    }
  ];
}

message WorkspaceAlreadyBoundDetails {}

message WorkspacePathMissingDetails {}

message AuthRequiredDetails {}

message WorkspaceMutationDetails {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
}

message WorkspaceDetachConflictDetails {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  string workspace_id = 2 [(buf.validate.field).string.min_len = 1];
  bool retryable = 3 [(buf.validate.field).bool.const = true];
}

message WorkspaceUnlinkBlocker {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "workspace_unlink_blocker.code"
      message: "workspace unlink blocker code is invalid"
      expression:
        "this in ['default_workspace', 'non_terminal_tasks', "
        "'executable_current_nodes', 'managed_owned_worktrees', "
        "'missing_history_snapshot', 'active_sessions']"
    }
  ];
  reserved 2;
  reserved "message";
  optional int32 count = 3 [(buf.validate.field).int32.gt = 0];

  option (buf.validate.message).cel = {
    id: "workspace_unlink_blocker.count"
    message: "default_workspace has no count and every counted blocker has a positive count"
    expression: "this.code == 'default_workspace' ? !has(this.count) : has(this.count)"
  };
}

message ProjectDeleteBlocker {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "project_delete_blocker.code"
      message: "project delete blocker code is invalid"
      expression: "this in ['non_terminal_tasks', 'active_sessions']"
    }
  ];
  reserved 2;
  reserved "message";
  int32 count = 3 [(buf.validate.field).int32.gt = 0];
}

message ProjectListSuccess {
  repeated ProjectSummary projects = 1;
}

message ProjectListError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
  }
}

message ProjectListResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ProjectListSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    ProjectListError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message ProjectHomeListRequest {
  optional int32 page_size = 1 [(buf.validate.field).int32 = {
    gt: 0
  }];
  optional string page_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "project_home_list.page_token.trimmed"
      message: "page_token must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
}

message ProjectHomeListSuccess {
  repeated ProjectHomeSummary projects = 1 [(buf.validate.field).repeated.max_items = 100];
  optional string next_page_token = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp generated_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp.gt = {seconds: 0}
  ];
}

message ProjectHomeListError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
  }
}

message ProjectHomeListResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ProjectHomeListSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    ProjectHomeListError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message ResolvePathRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

message ResolvePathSuccess {
  string canonical_root = 1 [(buf.validate.field).string.min_len = 1];
  ProjectAvailability path_availability = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional ProjectBinding binding = 3;
}

message ResolvePathError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    WorkspaceBindingAmbiguousDetails workspace_binding_ambiguous = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "workspace_binding_ambiguous"
      }
    ];
    kent.api.shared.InternalFailureDetails internal_failure = 3 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
  }
