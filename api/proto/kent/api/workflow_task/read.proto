      message: "project_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  optional string workflow_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  repeated string column_keys = 3 [
    (buf.validate.field).repeated.items.string.(kent.api.shared.workflow_key) = true
  ];
  repeated TaskStatusKind status_kinds = 4 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated TaskAttentionKind attention_kinds = 5 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  LabelFilter label_filter = 6 [(buf.validate.field).required = true];
  optional bool dependency_filter = 7;
  repeated ListSort sort = 8 [(buf.validate.field).repeated.max_items = 7];
  optional int32 offset = 9 [(buf.validate.field).int32.gte = 0];
  optional int32 limit = 10 [(buf.validate.field).int32.gt = 0];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.list_project_required"
    message: "project_id is required"
    expression: "has(this.project_id)"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.list_sort_unique"
    message: "sort fields must be unique"
    expression: "this.sort.map(selector, selector.field).unique()"
  };
}

message ListScope {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
