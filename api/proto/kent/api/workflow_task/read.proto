  string short_id = 2 [(buf.validate.field).string.min_len = 1];
  string workflow_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional string workflow_name = 4 [(buf.validate.field).string.min_len = 1];
  string title = 5 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at = 6 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 7 [(buf.validate.field).required = true];
  optional ColumnKeys column_keys = 8;
  TaskStatus status = 9 [(buf.validate.field).required = true];
  repeated string label_ids = 10 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
