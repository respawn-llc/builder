message ColumnKeys {
  repeated string values = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
}

message ListSuccess {
  ListScope scope = 1 [(buf.validate.field).required = true];
  MatchingWorkflowCardinality matching_workflow_cardinality = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int32 next_offset = 3 [(buf.validate.field).int32.gt = 0];
  google.protobuf.Timestamp generated_at = 4 [(buf.validate.field).required = true];
  repeated ListItem tasks = 5;

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.list_cardinality"
    message: "list scope and matching workflow cardinality must agree"
    expression:
      "(this.matching_workflow_cardinality != 1 || size(this.tasks) == 0) && "
      "(!has(this.scope.workflow_id) || this.matching_workflow_cardinality != 3)"
  };
}

message SearchRequest {
  SearchMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string query = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 4096
    },
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_query_trimmed"
      message: "query must be nonblank and trimmed"
      expression: "this.trim() != '' && this == this.trim()"
    }
  ];
  int32 context = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 64
  }];
  bool case_sensitive = 4;
  bool include_comments = 5;
  repeated string project_ids = 6 [(buf.validate.field).repeated.items = {
    string: {min_len: 1}
    cel: {
      id: "kent.workflow_task.search_project_id_trimmed"
      message: "project_ids must contain trimmed values"
      expression: "this == this.trim()"
    }
  }];
  repeated TaskStatusKind status_kinds = 7 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  int32 page_size = 8 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  optional int32 offset = 9 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_mode_case"
    message: "case_sensitive requires literal mode"
    expression: "!this.case_sensitive || this.mode == 1"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_project_ids_sorted_unique"
    message: "project_ids must be sorted and unique"
    expression: "this.project_ids == this.project_ids.sorted() && this.project_ids.unique()"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_status_kinds_sorted_unique"
    message: "status_kinds must be sorted and unique"
    expression: "this.status_kinds == this.status_kinds.sorted() && this.status_kinds.unique()"
  };
}

message SearchSource {
  SearchSourceKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string comment_id = 2 [(buf.validate.field).string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_source_comment"
    message: "comment source requires comment_id and other sources forbid it"
    expression: "(this.kind == 4) == has(this.comment_id)"
  };
}

message SearchLiteralHit {
  string before = 1;
  string match = 2 [(buf.validate.field).string.min_len = 1];
  string after = 3;
  bool left_truncated = 4;
  bool right_truncated = 5;
}

message SearchFts5Hit {
  string snippet = 1 [(buf.validate.field).string.min_len = 1];
}

message SearchHit {
  int32 ordinal = 1 [(buf.validate.field).int32.gt = 0];
  SearchSource source = 2 [(buf.validate.field).required = true];
  oneof match {
    option (buf.validate.oneof).required = true;

    SearchLiteralHit literal = 3;
    SearchFts5Hit fts5 = 4;
  }
}

message SearchGroup {
  string project_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_project_id_trimmed"
      message: "project_id must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  string project_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_project_key_trimmed"
      message: "project_key must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  string task_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_task_id_trimmed"
      message: "task_id must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  string short_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_short_id_trimmed"
      message: "short_id must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  string workflow_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_workflow_id_trimmed"
      message: "workflow_id must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  string title = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.search_group_title_trimmed"
      message: "title must be trimmed"
      expression: "this == this.trim()"
    }
  ];
  TaskStatus status = 7 [(buf.validate.field).required = true];
  int32 total_hit_count = 8 [(buf.validate.field).int32.gt = 0];
  repeated SearchHit hits = 9 [(buf.validate.field).repeated.min_items = 1];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_group_hit_count"
    message: "total_hit_count must include every returned hit"
    expression:
      "this.total_hit_count >= size(this.hits) && "
      "this.hits.all(hit, hit.ordinal <= this.total_hit_count) && "
      "this.hits.map(hit, hit.ordinal).unique()"
  };
}

message SearchSuccess {
  SearchMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated SearchGroup groups = 2;
  optional int32 next_offset = 3 [(buf.validate.field).int32.gt = 0];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_groups_unique"
    message: "search groups must contain unique task IDs"
    expression: "this.groups.map(group, group.task_id).unique()"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.search_hit_modes"
    message: "search hit payloads and sources must match the response mode"
    expression:
      "(this.mode == 1 && this.groups.all(group, group.hits.all(hit, has(hit.literal)))) || "
      "(this.mode == 2 && this.groups.all(group, group.hits.all(hit, has(hit.fts5) && hit.source.kind != 1)))"
  };
}

