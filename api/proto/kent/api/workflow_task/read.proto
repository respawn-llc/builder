option go_package = "core/shared/protoapi/gen/kent/api/workflow_task;workflowtaskpb";

enum TaskStatusKind {
  TASK_STATUS_KIND_UNSPECIFIED = 0;
  TASK_STATUS_KIND_DONE = 1;
  TASK_STATUS_KIND_WAITING_QUESTION = 2;
  TASK_STATUS_KIND_WAITING_APPROVAL = 3;
  TASK_STATUS_KIND_INTERRUPTED = 4;
  TASK_STATUS_KIND_RUNNING = 5;
  TASK_STATUS_KIND_QUEUED = 6;
  TASK_STATUS_KIND_BACKLOG = 7;
  TASK_STATUS_KIND_ACTIVE = 8;
}

enum TaskNativeState {
  TASK_NATIVE_STATE_UNSPECIFIED = 0;
  TASK_NATIVE_STATE_TERMINAL = 1;
  TASK_NATIVE_STATE_WAITING_ASK = 2;
  TASK_NATIVE_STATE_WAITING_APPROVAL = 3;
  TASK_NATIVE_STATE_INTERRUPTED = 4;
  TASK_NATIVE_STATE_RUNNING = 5;
  TASK_NATIVE_STATE_QUEUED = 6;
  TASK_NATIVE_STATE_ACTIVE = 7;
}

enum TaskAttentionKind {
  TASK_ATTENTION_KIND_UNSPECIFIED = 0;
  TASK_ATTENTION_KIND_QUESTION = 1;
  TASK_ATTENTION_KIND_APPROVAL = 2;
  TASK_ATTENTION_KIND_INTERRUPTED = 3;
}

enum ListSortField {
  LIST_SORT_FIELD_UNSPECIFIED = 0;
  LIST_SORT_FIELD_CREATED = 1;
  LIST_SORT_FIELD_UPDATED = 2;
  LIST_SORT_FIELD_STATUS = 3;
  LIST_SORT_FIELD_COLUMN = 4;
  LIST_SORT_FIELD_TITLE = 5;
  LIST_SORT_FIELD_LABELS = 6;
  LIST_SORT_FIELD_SHORT_ID = 7;
}

enum ListSortDirection {
  LIST_SORT_DIRECTION_UNSPECIFIED = 0;
  LIST_SORT_DIRECTION_ASC = 1;
  LIST_SORT_DIRECTION_DESC = 2;
}

enum MatchingWorkflowCardinality {
  MATCHING_WORKFLOW_CARDINALITY_UNSPECIFIED = 0;
  MATCHING_WORKFLOW_CARDINALITY_NONE = 1;
  MATCHING_WORKFLOW_CARDINALITY_ONE = 2;
  MATCHING_WORKFLOW_CARDINALITY_MULTIPLE = 3;
}

enum ListScopeErrorReason {
  LIST_SCOPE_ERROR_REASON_UNSPECIFIED = 0;
  LIST_SCOPE_ERROR_REASON_NO_LINKED_WORKFLOWS = 1;
  LIST_SCOPE_ERROR_REASON_WORKFLOW_NOT_LINKED = 2;
  LIST_SCOPE_ERROR_REASON_WORKFLOW_REQUIRED_FOR_COLUMNS = 3;
}

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_LITERAL = 1;
  SEARCH_MODE_FTS5 = 2;
}

enum SearchSourceKind {
  SEARCH_SOURCE_KIND_UNSPECIFIED = 0;
  SEARCH_SOURCE_KIND_SHORT_ID = 1;
  SEARCH_SOURCE_KIND_TITLE = 2;
  SEARCH_SOURCE_KIND_BODY = 3;
  SEARCH_SOURCE_KIND_COMMENT = 4;
}

enum NamedLabelFilterMode {
  NAMED_LABEL_FILTER_MODE_UNSPECIFIED = 0;
  NAMED_LABEL_FILTER_MODE_ANY = 1;
  NAMED_LABEL_FILTER_MODE_ALL = 2;
}

enum ExecutionTargetProvenance {
  EXECUTION_TARGET_PROVENANCE_UNSPECIFIED = 0;
  EXECUTION_TARGET_PROVENANCE_RESOLVED = 1;
  EXECUTION_TARGET_PROVENANCE_LEGACY_OBSERVED = 2;
}

enum DependencyDirection {
  DEPENDENCY_DIRECTION_UNSPECIFIED = 0;
  DEPENDENCY_DIRECTION_BLOCKED_BY = 1;
  DEPENDENCY_DIRECTION_BLOCKS = 2;
}

enum DependencySatisfaction {
  DEPENDENCY_SATISFACTION_UNSPECIFIED = 0;
  DEPENDENCY_SATISFACTION_SATISFIED = 1;
  DEPENDENCY_SATISFACTION_UNSATISFIED = 2;
}

message LabelFilter {
  oneof filter {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty none = 1;
    NamedLabelFilter named = 2;
    google.protobuf.Empty unlabeled = 3;
  }
}

message NamedLabelFilter {
  NamedLabelFilterMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string label_ids = 2 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  repeated string excluded_label_ids = 3 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.named_label_filter"
    message: "named label filter requires labels, has a combined limit, and cannot include and exclude the same label"
    expression:
      "size(this.label_ids) + size(this.excluded_label_ids) > 0 && "
      "size(this.label_ids) + size(this.excluded_label_ids) <= 100 && "
      "this.label_ids.all(id, !(id in this.excluded_label_ids))"
  };
}

message ListSort {
