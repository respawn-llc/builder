    }];
  }
}

message AttentionNotificationStartResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    AttentionNotificationStartError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

