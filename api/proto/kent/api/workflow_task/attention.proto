      id: "kent.workflow_task.attention_question_suggestion_nonblank"
      message: "suggestions must be non-blank"
      expression: "this.trim() != ''"
    }
  }];
  optional int32 recommended_option_index = 2 [(buf.validate.field).int32.gte = 1];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.attention_question_recommendation"
    message: "recommended_option_index must identify a suggestion"
    expression: "!has(this.recommended_option_index) || this.recommended_option_index <= size(this.suggestions)"
  };
}

message ApprovalQuestion {
  repeated kent.api.prompt.ApprovalDecision approval_decisions = 1 [(buf.validate.field).repeated = {
