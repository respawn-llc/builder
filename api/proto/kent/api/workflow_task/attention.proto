message ConfiguredExecutionTargetUnavailableDetails {
  kent.api.workflow_definition.ExecutionTargetMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string requested_ref = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.unavailable_requested_ref_nonblank"
      message: "requested_ref must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  ExecutionTargetUnavailableCause cause = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.unavailable_execution_target"
    message: "requested_ref is required only for custom-ref mode"
    expression:
      "(this.mode == 4 && has(this.requested_ref)) || "
      "(this.mode != 4 && !has(this.requested_ref))"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.unavailable_execution_target_concrete"
    message: "configured unavailable execution target must be concrete"
    expression: "this.mode in [1, 2, 3, 4]"
  };
}

