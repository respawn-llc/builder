message SessionPromptAttentionTarget {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AttentionNotificationTarget {
  AttentionNotificationTargetKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  oneof target {
    option (buf.validate.oneof).required = true;
    WorkflowTaskAttentionTarget workflow_task = 2;
    SessionPromptAttentionTarget session_prompt = 3;
  }

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_target_kind"
    message: "target kind must match its detail"
    expression:
      "(this.kind == 1 && has(this.workflow_task)) || "
      "(this.kind == 2 && has(this.session_prompt))"
  };
}

message AttentionNotification {
  AttentionNotificationID id = 1 [(buf.validate.field).required = true];
  AttentionNotificationKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp occurred_at = 3 [(buf.validate.field).required = true];
  uint64 revision = 4 [(buf.validate.field).uint64 = {
    gte: 1
    lte: 9007199254740991
  }];
  oneof state {
    option (buf.validate.oneof).required = true;
    kent.api.attention.QuestionState question = 5;
    kent.api.attention.ApprovalState approval = 6;
    WorkflowApprovalState workflow_approval = 7;
    InterruptedCurrentNodeState interrupted_current_node = 8;
  }
  AttentionNotificationTarget target = 9 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_identity_kind"
    message: "notification id kind must match notification kind"
    expression: "this.id.kind == this.kind"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_state_kind"
    message: "notification kind must match its state"
    expression:
      "(this.kind == 1 && has(this.question)) || "
      "(this.kind == 2 && has(this.approval)) || "
      "(this.kind == 3 && has(this.workflow_approval)) || "
      "(this.kind == 4 && has(this.interrupted_current_node))"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_approval_target"
    message: "Session approval notifications require a Session Prompt target"
    expression:
      "!has(this.approval) || "
      "has(this.target.session_prompt)"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_workflow_approval_state"
    message: "Workflow approval notifications require a matching Workflow Task approval focus"
    expression:
      "!has(this.workflow_approval) || "
      "(has(this.target.workflow_task) && has(this.target.workflow_task.focus.approval) && "
      "this.target.workflow_task.focus.approval.approval_id == this.workflow_approval.approval_id)"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_interrupted_state"
    message: "interrupted-current-node notifications require a Workflow Task current-node target and interrupted focus"
    expression:
      "!has(this.interrupted_current_node) || "
      "(has(this.target.workflow_task) && has(this.target.workflow_task.current_node_id) && "
      "has(this.target.workflow_task.focus.interrupted_current_node))"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_question_focus"
    message: "Workflow Task question focus must match prepared ask ids"
    expression:
      "!has(this.question) || !has(this.target.workflow_task) || "
      "(has(this.target.workflow_task.focus.question) && "
      "this.target.workflow_task.focus.question.ask_ids.all(id, id in this.question.prepared_ask_ids) && "
      "this.question.prepared_ask_ids.all(id, id in this.target.workflow_task.focus.question.ask_ids))"
  };
}

message ResolvedAttentionNotification {
  AttentionNotificationID id = 1 [(buf.validate.field).required = true];
  AttentionNotificationKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp occurred_at = 3 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.resolved_notification_kind"
    message: "resolved notification id kind must match event kind"
    expression: "this.id.kind == this.kind"
  };
}

message AttentionSnapshotComplete {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AttentionNotificationEvent {
  uint64 sequence = 1 [(buf.validate.field).uint64 = {
    gte: 1
    lte: 9007199254740991
  }];
  AttentionNotificationSource source = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AttentionNotificationEventType type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  oneof payload {
    option (buf.validate.oneof).required = true;
    AttentionNotification pending = 4;
    ResolvedAttentionNotification resolved = 5;
    AttentionSnapshotComplete snapshot_complete = 6;
  }

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_event_type"
    message: "attention event type must match its payload"
    expression:
      "(this.type == 1 && has(this.pending)) || "
      "(this.type == 2 && has(this.resolved)) || "
      "(this.type == 3 && has(this.snapshot_complete))"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.notification_snapshot_source"
    message: "snapshot-complete events must have snapshot source"
    expression: "!has(this.snapshot_complete) || this.source == 2"
  };
}

message AttentionNotificationStartError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
