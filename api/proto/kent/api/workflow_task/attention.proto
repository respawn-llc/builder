  }

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.attention_question_kind"
    message: "question kind must match its prompt detail"
    expression:
      "(this.kind == 1 && has(this.ordinary)) || "
      "(this.kind == 2 && has(this.approval))"
  };
}

