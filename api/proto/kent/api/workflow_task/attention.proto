    option (buf.validate.oneof).required = true;
    GenericInterruptionDetails generic = 3;
    ConfiguredExecutionTargetUnavailableDetails configured_execution_target_unavailable = 4;
    SetupRecoveryDetails setup_recovery = 5;
    ConfiguredExecutionTargetSetupRecoveryDetails configured_execution_target_unavailable_with_setup_recovery = 6;
  }

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.interruption_detail_field_names_unique"
