message SetupRecoveryDetails {
  string setup_operation_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  AttentionSetupRecoveryCause cause = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string diagnostic = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.setup_recovery_diagnostic_nonblank"
      message: "diagnostic must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string script_path = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.setup_recovery_script_path_nonblank"
      message: "script_path must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  AttentionSetupRequirement setup_requirement = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  SetupExecutionTarget execution_target = 6 [(buf.validate.field).required = true];
  optional RetainedWorktree retained_worktree = 7;
  optional RetainedWorktree retained_previous_worktree = 8;

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.setup_recovery_script_facts"
    message: "setup script recovery requires script and retained-worktree facts; target preparation does not carry a script"
    expression:
      "(this.cause == 3 && !has(this.script_path)) || "
      "(this.cause != 3 && has(this.script_path) && this.setup_requirement == 1 && has(this.retained_worktree))"
  };
  option (buf.validate.message).cel = {
    id: "kent.workflow_task.setup_recovery_completed_worktree"
    message: "completed setup recovery requires a retained worktree"
    expression: "this.setup_requirement != 2 || has(this.retained_worktree)"
  };
}

