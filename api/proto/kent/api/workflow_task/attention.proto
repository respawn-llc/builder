      expression: "this == this.trim()"
    }
  ];
  optional string session_id = 3 [(buf.validate.field).string.min_len = 1];
  optional string effective_assignee = 4 [(buf.validate.field).string.min_len = 1];
  optional string effective_thinking = 5 [(buf.validate.field).string.min_len = 1];
}

message OrdinaryQuestion {
  repeated string suggestions = 1 [(buf.validate.field).repeated.items = {
    string: {min_len: 1}
