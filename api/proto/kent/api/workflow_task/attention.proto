message AttentionCurrentNode {
  string node_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.attention_current_node_id_trimmed"
      message: "node_id must not have surrounding whitespace"
      expression: "this == this.trim()"
    }
  ];
  optional string transition_branch_key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.attention_current_node_branch_trimmed"
