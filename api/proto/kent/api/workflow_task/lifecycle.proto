message LabelsUpdateRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated string add_label_ids = 2 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  repeated string remove_label_ids = 3 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.labels_update_disjoint"
