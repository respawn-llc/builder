syntax = "proto3";

package kent.api.workflow_task;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kent/api/prompt/prompt.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";
import "kent/api/workflow_definition/workflow_definition.proto";
import "kent/api/workflow_task/attention.proto";
import "kent/api/workflow_task/read.proto";
import "kent/api/worktree/worktree.proto";

option go_package = "core/shared/protoapi/gen/kent/api/workflow_task;workflowtaskpb";

enum DependencyRole {
  DEPENDENCY_ROLE_UNSPECIFIED = 0;
  DEPENDENCY_ROLE_BLOCKER = 1;
  DEPENDENCY_ROLE_BLOCKED = 2;
}

enum DependencyMutationOutcome {
  DEPENDENCY_MUTATION_OUTCOME_UNSPECIFIED = 0;
  DEPENDENCY_MUTATION_OUTCOME_ADDED = 1;
  DEPENDENCY_MUTATION_OUTCOME_ALREADY_PRESENT = 2;
  DEPENDENCY_MUTATION_OUTCOME_REMOVED = 3;
  DEPENDENCY_MUTATION_OUTCOME_ALREADY_ABSENT = 4;
}

enum MovePreviewBlocker {
  MOVE_PREVIEW_BLOCKER_UNSPECIFIED = 0;
  MOVE_PREVIEW_BLOCKER_INVALID_WORKFLOW = 1;
  MOVE_PREVIEW_BLOCKER_NO_SOURCE_POSITION = 2;
  MOVE_PREVIEW_BLOCKER_UNSUPPORTED_DESTINATION = 3;
  MOVE_PREVIEW_BLOCKER_WAITING_QUESTION = 4;
  MOVE_PREVIEW_BLOCKER_LIFECYCLE_CONFLICT = 5;
  MOVE_PREVIEW_BLOCKER_CONTEXT_SESSION_UNAVAILABLE = 6;
  MOVE_PREVIEW_BLOCKER_NO_USABLE_TRANSITION = 7;
  MOVE_PREVIEW_BLOCKER_PARALLEL_BRANCH_REQUIRES_FAN_OUT = 8;
}

enum CompleteActorKind {
  COMPLETE_ACTOR_KIND_UNSPECIFIED = 0;
  COMPLETE_ACTOR_KIND_AGENT = 1;
  COMPLETE_ACTOR_KIND_USER = 2;
}

enum CommentAuthorKind {
  COMMENT_AUTHOR_KIND_UNSPECIFIED = 0;
  COMMENT_AUTHOR_KIND_USER = 1;
  COMMENT_AUTHOR_KIND_AGENT = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_RUNNING = 1;
  SESSION_STATUS_QUESTION = 2;
  SESSION_STATUS_IDLE = 3;
}

enum ObservationMode {
  OBSERVATION_MODE_UNSPECIFIED = 0;
  OBSERVATION_MODE_WAIT = 1;
  OBSERVATION_MODE_WATCH = 2;
}

enum CreateSelectionReason {
  CREATE_SELECTION_REASON_UNSPECIFIED = 0;
  CREATE_SELECTION_REASON_NO_LINKED_WORKFLOWS = 1;
  CREATE_SELECTION_REASON_WORKFLOW_NOT_LINKED = 2;
  CREATE_SELECTION_REASON_AMBIGUOUS_WITHOUT_DEFAULT = 3;
}

enum CreateConflictReason {
  CREATE_CONFLICT_REASON_UNSPECIFIED = 0;
  CREATE_CONFLICT_REASON_SERIALIZATION = 1;
}

enum StartConflictReason {
  START_CONFLICT_REASON_UNSPECIFIED = 0;
  START_CONFLICT_REASON_ALREADY_STARTED = 1;
}

enum DependencyErrorReason {
  DEPENDENCY_ERROR_REASON_UNSPECIFIED = 0;
  DEPENDENCY_ERROR_REASON_MISSING_TASK = 1;
  DEPENDENCY_ERROR_REASON_SELF = 2;
  DEPENDENCY_ERROR_REASON_PROJECT_MISMATCH = 3;
  DEPENDENCY_ERROR_REASON_RECIPROCAL = 4;
  DEPENDENCY_ERROR_REASON_BLOCKER_LIMIT = 5;
  DEPENDENCY_ERROR_REASON_BLOCKED_LIMIT = 6;
}

enum LabelErrorReason {
  LABEL_ERROR_REASON_UNSPECIFIED = 0;
  LABEL_ERROR_REASON_INVALID_NAME = 1;
  LABEL_ERROR_REASON_NAME_CONFLICT = 2;
  LABEL_ERROR_REASON_CATALOG_LIMIT = 3;
  LABEL_ERROR_REASON_PROJECT_NOT_FOUND = 4;
  LABEL_ERROR_REASON_LABEL_NOT_FOUND = 5;
  LABEL_ERROR_REASON_TASK_NOT_FOUND = 6;
  LABEL_ERROR_REASON_WRONG_PROJECT = 7;
  LABEL_ERROR_REASON_INVALID_FILTER = 8;
  LABEL_ERROR_REASON_INVALID_MUTATION = 9;
}

enum ExecutionTargetResolutionCode {
  EXECUTION_TARGET_RESOLUTION_CODE_UNSPECIFIED = 0;
  EXECUTION_TARGET_RESOLUTION_CODE_INVALID_REVISION = 1;
  EXECUTION_TARGET_RESOLUTION_CODE_NON_COMMIT = 2;
  EXECUTION_TARGET_RESOLUTION_CODE_GIT_FAILURE = 3;
}

enum LockedExecutionTargetCause {
  LOCKED_EXECUTION_TARGET_CAUSE_UNSPECIFIED = 0;
  LOCKED_EXECUTION_TARGET_CAUSE_DETACHED_HEAD = 1;
  LOCKED_EXECUTION_TARGET_CAUSE_INVALID_ROOT = 2;
  LOCKED_EXECUTION_TARGET_CAUSE_ROOT_INACCESSIBLE = 3;
  LOCKED_EXECUTION_TARGET_CAUSE_MISSING_BRANCH = 4;
  LOCKED_EXECUTION_TARGET_CAUSE_CONFLICT = 5;
  LOCKED_EXECUTION_TARGET_CAUSE_GIT_FAILURE = 6;
}

enum InitialBranchErrorReason {
  INITIAL_BRANCH_ERROR_REASON_UNSPECIFIED = 0;
  INITIAL_BRANCH_ERROR_REASON_INVALID_NAME = 1;
  INITIAL_BRANCH_ERROR_REASON_LOCAL_COLLISION = 2;
  INITIAL_BRANCH_ERROR_REASON_REMOTE_TRACKING_COLLISION = 3;
  INITIAL_BRANCH_ERROR_REASON_NO_MANAGED_TARGET = 4;
  INITIAL_BRANCH_ERROR_REASON_OPERATION_CANNOT_CREATE_WORKTREE = 5;
  INITIAL_BRANCH_ERROR_REASON_POST_CREATION_MISMATCH = 6;
}

message DependencyCreateIntent {
  string related_task_id = 1 [(buf.validate.field).string.min_len = 1];
  DependencyRole new_task_role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message CreateRequest {
  string project_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.create_project_id_nonblank"
      message: "project_id must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string workflow_id = 2 [(buf.validate.field).string.uuid = true];
  string title = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.create_title_nonblank"
      message: "title must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string body = 4;
  optional string source_url = 5 [(buf.validate.field).string.min_len = 1];
  optional string source_workspace_id = 6 [(buf.validate.field).string.min_len = 1];
  repeated string label_ids = 7 [
    (buf.validate.field).repeated = {
      max_items: 100
      unique: true
    },
    (buf.validate.field).repeated.items.string.uuid = true,
    (buf.validate.field).repeated.items.string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional DependencyCreateIntent dependency_intent = 8;
}

message CreateSuccess {
  TaskSummary task = 1 [(buf.validate.field).required = true];
}

message UpdateRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string title = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.update_title_nonblank"
      message: "title must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string body = 3;
  optional string source_workspace_id = 4 [(buf.validate.field).string.min_len = 1];
}

message UpdateSuccess {
  TaskSummary task = 1 [(buf.validate.field).required = true];
}

message ExecutionTargetSelection {
  kent.api.workflow_definition.ExecutionTargetMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0, 5]
  }];
  optional string custom_ref = 2 [(buf.validate.field).string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.execution_target_selection"
    message: "custom_ref is required only for custom-ref mode"
    expression:
      "(this.mode == 4 && has(this.custom_ref) && this.custom_ref.trim() != '') || "
      "(this.mode != 4 && !has(this.custom_ref))"
  };
}

message SelectionRequired {
  oneof reason {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty policy_requires_selection = 1;
    ConfiguredExecutionTargetUnavailableDetails configured_target_unavailable = 2;
  }
}

message DependencyConfirmationRequired {
  int32 unsatisfied_dependency_count = 1 [(buf.validate.field).int32.gt = 0];
}

message StartRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string invoking_session_id = 2 [(buf.validate.field).string.min_len = 1];
  string setup_operation_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional ExecutionTargetSelection execution_target = 4;
  optional string branch_name = 5 [(buf.validate.field).string.min_len = 1];
  bool proceed_despite_dependencies = 6;
}

message StartApplied {
  repeated AttentionCurrentNode current_nodes = 1 [(buf.validate.field).repeated.min_items = 1];
}

message StartSuccess {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    StartApplied applied = 1;
    SelectionRequired selection_required = 2;
    DependencyConfirmationRequired dependency_confirmation_required = 3;
  }
}

message InterruptRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string invoking_session_id = 2 [(buf.validate.field).string.min_len = 1];
  optional string session_id = 3 [(buf.validate.field).string.min_len = 1];
  optional string reason = 4;
}

message ResumeRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string invoking_session_id = 2 [(buf.validate.field).string.min_len = 1];
  string setup_operation_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  optional ExecutionTargetSelection execution_target = 4;
  optional string branch_name = 5 [(buf.validate.field).string.min_len = 1];
}

message ResumeApplied {
  repeated AttentionCurrentNode current_nodes = 1 [(buf.validate.field).repeated.min_items = 1];
}

message ResumeSuccess {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ResumeApplied applied = 1;
    SelectionRequired selection_required = 2;
    ResumeApplied no_op = 3;
  }
}

message ApproveRequest {
  string approval_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string invoking_session_id = 2 [(buf.validate.field).string.min_len = 1];
}

message ApproveApplied {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated AttentionCurrentNode current_nodes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message ApproveSuccess {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ApproveApplied applied = 1;
    SelectionRequired selection_required = 2;
  }
}

message MovePreviewRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 2 [(buf.validate.field).string.min_len = 1];
}

message MoveRequiredValue {
  string node_key = 1 [(buf.validate.field).string.min_len = 1];
  string output_name = 2 [(buf.validate.field).string.min_len = 1];
  optional string description = 3 [(buf.validate.field).string.min_len = 1];
  optional string resolved_value = 4 [(buf.validate.field).string.min_len = 1];
}

message MoveTransitionChoice {
  string transition_key = 1 [(buf.validate.field).string.min_len = 1];
  string label = 2 [(buf.validate.field).string.min_len = 1];
  string source_node_display_name = 3 [(buf.validate.field).string.min_len = 1];
  repeated MoveRequiredValue required_values = 4;
}

message MovePreviewNoOp {
  repeated AttentionCurrentNode current_nodes = 1 [(buf.validate.field).repeated.min_items = 1];
}

message MovePreviewDirect {}

message MovePreviewTransition {
  repeated MoveTransitionChoice choices = 1 [(buf.validate.field).repeated.min_items = 1];
}

message MovePreviewBlocked {
  MovePreviewBlocker reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message MovePreviewSuccess {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    MovePreviewNoOp no_op = 1;
    MovePreviewDirect direct = 2;
    MovePreviewTransition transition = 3;
    MovePreviewBlocked blocked = 4;
  }
}

message NamedValue {
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.named_value_name_nonblank"
      message: "name must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string value = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 65536
    },
    (buf.validate.field).cel = {
      id: "kent.workflow_task.named_value_nonblank"
      message: "value must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}

message NodeOutputValues {
  string node_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.workflow_task.node_output_key_nonblank"
      message: "node_key must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  repeated NamedValue outputs = 2;

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.node_output_names_unique"
    message: "output names must be unique"
    expression: "this.outputs.map(output, output.name).unique()"
  };
}

message MoveRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string invoking_session_id = 2 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 3 [(buf.validate.field).string.min_len = 1];
  optional string transition_key = 4 [(buf.validate.field).string.min_len = 1];
  repeated NodeOutputValues values = 5;
  optional string commentary = 6;
  optional ExecutionTargetSelection execution_target = 7;
  optional string branch_name = 8 [(buf.validate.field).string.min_len = 1];
  bool proceed_despite_dependencies = 9;

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.move_node_keys_unique"
    message: "value node keys must be unique"
    expression: "this.values.map(value, value.node_key).unique()"
  };
}

message MoveNoOp {
  repeated AttentionCurrentNode current_nodes = 1 [(buf.validate.field).repeated.min_items = 1];
  optional kent.api.worktree.RetainedPreviousWorktree retained_previous_worktree = 2;
}

message MoveApplied {
  repeated AttentionCurrentNode current_nodes = 1 [(buf.validate.field).repeated.min_items = 1];
  optional kent.api.worktree.RetainedPreviousWorktree retained_previous_worktree = 2;
}

message MoveSuccess {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    MoveNoOp no_op = 1;
    MoveApplied applied = 2;
    SelectionRequired selection_required = 3;
    DependencyConfirmationRequired dependency_confirmation_required = 4;
  }
}

message CompleteRequest {
  optional string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string task_id = 2 [(buf.validate.field).string.min_len = 1];
  optional string transition_id = 3 [(buf.validate.field).string.min_len = 1];
  repeated NamedValue output_values = 4;
  optional string commentary = 5;
  CompleteActorKind actor_kind = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string agent_session_id = 7 [(buf.validate.field).string.min_len = 1];
  bool force = 8;

  option (buf.validate.message).cel = {
    id: "kent.workflow_task.complete_actor"
    message: "completion actor, selector, and force fields must agree"
    expression:
      "(this.actor_kind == 1 && has(this.agent_session_id) && !this.force && !(has(this.session_id) && has(this.task_id))) || "
      "(this.actor_kind == 2 && !has(this.agent_session_id) && this.force && (has(this.session_id) != has(this.task_id)))"
  };
}

message CompletionHandoff {
  string source_node_display_name = 1 [(buf.validate.field).string.min_len = 1];
  string destination_display_name = 2 [(buf.validate.field).string.min_len = 1];
}

message CompleteSuccess {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated AttentionCurrentNode current_nodes = 2;
  optional string pending_approval_id = 3 [(buf.validate.field).string.min_len = 1];
  CompletionHandoff handoff = 4 [(buf.validate.field).required = true];
}

message DeleteRequest {
