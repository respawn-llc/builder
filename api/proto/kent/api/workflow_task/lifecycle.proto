    defined_only: true
    not_in: [0]
  }];
  int32 total_count = 2 [(buf.validate.field).int32.gte = 0];
  optional int32 unsatisfied_count = 3 [(buf.validate.field).int32.gte = 0];
  repeated DependencyItem items = 4;
}

message DependencyListSuccess {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string short_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated DependencyListDirection directions = 3;
}

