  optional Diagnostic diagnostic = 4;
  option (buf.validate.message).cel = {
    id: "kent.transcript.assistant_abort_diagnostic"
    message: "only failed assistant aborts carry a diagnostic"
    expression: "(this.reason == 2 && has(this.diagnostic)) || (this.reason != 2 && !has(this.diagnostic))"
  };
}

