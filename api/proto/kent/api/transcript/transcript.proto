message Diagnostic {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.diagnostic_code_nonblank"
      message: "diagnostic code must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string detail = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.diagnostic_detail_nonblank"
      message: "diagnostic detail must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}

message CommittedRowLocator {
  int64 event_sequence = 1 [(buf.validate.field).int64 = {
    gte: 1
    lte: 9007199254740991
  }];
  int32 row_ordinal = 2 [(buf.validate.field).int32.gte = 1];
}

message UserRow {
  string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string text = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_text_nonblank"
      message: "user row text must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string condensed_text = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_condensed_text_nonblank"
      message: "condensed user row text must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string rollback_target_id = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.user_row_rollback_target_nonblank"
      message: "rollback target ID must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional int64 committed_at_unix_ms = 5 [(buf.validate.field).int64 = {
    gte: -8640000000000000
    lte: 8640000000000000
  }];
}

message AssistantRow {
  string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
