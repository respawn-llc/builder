    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  AssistantPhase phase = 3 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  optional int64 committed_at_unix_ms = 4 [(buf.validate.field).int64 = {
    gte: -8640000000000000
    lte: 8640000000000000
  }];
}

message ToolRow {
  string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
