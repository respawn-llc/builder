}

message CacheWarning {
  string scope = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.cache_warning_scope_nonblank"
      message: "cache-warning scope must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string reason = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.cache_warning_reason_nonblank"
      message: "cache-warning reason must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional int32 lost_input_tokens = 3 [(buf.validate.field).int32.gte = 1];
  EntryVisibility visibility = 4 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
}

message CompactionNotice {
  optional int32 count = 1 [(buf.validate.field).int32.gte = 1];
  optional string detail = 2 [(buf.validate.field).string.min_len = 1];
}

message ToolOutputRepair {
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "fresh_resource",
      "live_provider_rejection"
    ]
  }];
  int32 count = 2 [(buf.validate.field).int32.gte = 1];
}

message ProviderModelMismatch {
  string requested_model = 1 [(buf.validate.field).string.min_len = 1];
  string served_model = 2 [(buf.validate.field).string.min_len = 1];
}

message BackgroundNoticeIdentity {
  string activity_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string process_id = 2 [(buf.validate.field).string.min_len = 1];
  optional int32 exit_code = 3;
}

message WorktreeContext {
  optional string branch = 1 [(buf.validate.field).string.min_len = 1];
  string worktree_path = 2 [(buf.validate.field).string.min_len = 1];
  string workspace_root = 3 [(buf.validate.field).string.min_len = 1];
  string effective_cwd = 4 [(buf.validate.field).string.min_len = 1];
}

message NoticeRow {
  optional string step_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  NoticeReason reason = 2 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  NoticeSeverity severity = 3 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  optional NoticeMessageType message_type = 4 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  optional string legacy_text = 5 [(buf.validate.field).string.min_len = 1];
  optional string notice_id = 6 [(buf.validate.field).string.min_len = 1];
  optional string source_path = 7 [(buf.validate.field).string.min_len = 1];
  optional WorktreeContext worktree = 8;
  optional CacheWarning cache_warning = 9;
  optional CompactionNotice compaction = 10;
  optional ToolOutputRepair tool_output_repair = 11;
  optional Diagnostic diagnostic = 12;
  optional BackgroundNoticeIdentity background = 13;
  optional string condensed_text = 14 [(buf.validate.field).string.min_len = 1];
  optional string compact_label = 15 [(buf.validate.field).string.min_len = 1];
  optional ProviderModelMismatch provider_model_mismatch = 16;
  option (buf.validate.message).cel = {
    id: "kent.transcript.notice_reason_payload"
    message: "notice payload must match reason"
    expression:
      "(this.reason == 1 && has(this.cache_warning) && !has(this.legacy_text) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 2 && has(this.compaction) && has(this.message_type) && this.message_type == 5 && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 3 && (has(this.legacy_text) || has(this.message_type)) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 4 && has(this.diagnostic) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.provider_model_mismatch)) || "
      "(this.reason == 5 && has(this.tool_output_repair) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.provider_model_mismatch) && !has(this.diagnostic) && !has(this.background)) || "
      "(this.reason == 6 && has(this.provider_model_mismatch) && !has(this.legacy_text) && !has(this.cache_warning) && !has(this.compaction) && !has(this.tool_output_repair) && !has(this.diagnostic) && !has(this.background))"
  };
}

message CommittedRow {
  EntryVisibility visibility = 1 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  RowIntegrity integrity = 2 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  CommittedRowLocator locator = 3 [(buf.validate.field).required = true];
  oneof row {
    option (buf.validate.oneof).required = true;
    UserRow user = 4;
    AssistantRow assistant = 5;
    ToolRow tool = 6;
    ReasoningTraceRow reasoning_trace = 7;
    NoticeRow notice = 8;
    ReviewerFeedbackRow reviewer_feedback = 9;
    ReviewerErrorRow reviewer_error = 10;
  }
  option (buf.validate.message).cel = {
    id: "kent.transcript.reviewer_error_visibility"
    message: "reviewer error rows must use ongoing visibility"
    expression: "!has(this.reviewer_error) || this.visibility == 1"
  };
}

message RuntimeReadModelUpdate {
  kent.api.runtime.ReadModelVersion version = 1 [(buf.validate.field).required = true];
  kent.api.runtime.Activity activity = 2 [(buf.validate.field).required = true];
}

message SessionIdentity {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string session_name = 2 [(buf.validate.field).string.min_len = 1];
  kent.api.runtime.ConversationFreshness conversation_freshness = 3 [(buf.validate.field).enum = {defined_only: true not_in: [0]}];
  optional kent.api.worktree.SessionExecutionTarget execution_target = 4;
}

message SessionStatus {
  string reviewer_frequency = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.session_reviewer_frequency_nonblank"
      message: "reviewer_frequency must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  bool reviewer_enabled = 2;
  bool auto_compaction_enabled = 3;
  bool questions_enabled = 4;
  bool fast_mode_available = 5;
  bool fast_mode_enabled = 6;
  string thinking_level = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.transcript.session_thinking_level_nonblank"
      message: "thinking_level must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string compaction_mode = 8 [
    (buf.validate.field).string = {in: ["native", "local", "none"]}
  ];
  int32 compaction_count = 9 [(buf.validate.field).int32.gte = 0];
  optional string previous_session_id = 10 [(buf.validate.field).string.min_len = 1];
  optional string parent_agent_session_id = 11 [(buf.validate.field).string.min_len = 1];
  optional string navigation_target_session_id = 12 [(buf.validate.field).string.min_len = 1];
  optional kent.api.runtime.WorkflowSessionStatus workflow = 13;
  option (buf.validate.message).cel = {
    id: "kent.transcript.fast_mode_availability"
    message: "fast mode cannot be enabled when unavailable"
    expression: "!this.fast_mode_enabled || this.fast_mode_available"
  };
}

