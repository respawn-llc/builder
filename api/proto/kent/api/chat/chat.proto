syntax = "proto3";

package kent.api.chat;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "kent/api/auth/auth.proto";
import "kent/api/chat_settings/chat_settings.proto";
import "kent/api/prompt_command/prompt_command.proto";
import "kent/api/prompt_command/validation.proto";
import "kent/api/server/server.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/chat;chatpb";

message ExistingSessionTarget {
  string session_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message NewChatTarget {
  string project_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.(kent.api.shared.nonblank) = true,
    (buf.validate.field).string.(kent.api.shared.trimmed) = true
  ];
  string workspace_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.(kent.api.shared.nonblank) = true,
    (buf.validate.field).string.(kent.api.shared.trimmed) = true
  ];
  kent.api.chat_settings.InitialChatSettings initial_settings = 3 [(buf.validate.field).required = true];
}

message ChatTarget {
  oneof target {
    option (buf.validate.oneof).required = true;

    ExistingSessionTarget session = 1;
    NewChatTarget new_chat = 2;
  }
}

message CommandInvocation {
  string catalog_identity = 1 [
    (buf.validate.field).string.(kent.api.prompt_command.canonical_name) = true
  ];
  string token = 2 [
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).cel = {
      id: "kent.chat.command_token"
      message: "command token must start with a slash and contain no whitespace"
      expression:
        "this.startsWith('/') && "
        "this.split('').all(character, character.trim() != '')"
    }
  ];
  string separator_whitespace = 3 [
    (buf.validate.field).cel = {
      id: "kent.chat.command_separator_whitespace"
      message: "command separator must contain only whitespace"
      expression: "this == '' || this.trim() == ''"
    }
  ];
  string arguments = 4;

  option (buf.validate.message).cel = {
    id: "kent.chat.command_arguments_separator"
    message: "command arguments require separator whitespace"
    expression: "this.arguments == '' || this.separator_whitespace != ''"
  };
}

message Activation {
  oneof input {
    option (buf.validate.oneof).required = true;

    string text = 1 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.(kent.api.shared.nonblank) = true
    ];
    CommandInvocation command = 2;
  }
}

message CompactionInvocation {
  string token = 1 [(buf.validate.field).string.const = "/compact"];
  string separator_whitespace = 2 [
    (buf.validate.field).cel = {
      id: "kent.chat.compaction_separator_whitespace"
      message: "compaction separator must contain only whitespace"
      expression: "this == '' || this.trim() == ''"
    }
  ];
  string raw_guidance = 3;

  option (buf.validate.message).cel = {
    id: "kent.chat.compaction_guidance_separator"
    message: "compaction guidance requires separator whitespace"
    expression: "this.raw_guidance == '' || this.separator_whitespace != ''"
  };
}

message QueueItemIdentity {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message CompactionRequestIdentity {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message PendingWorkCapacityDetails {}

message RuntimeUnavailableDetails {}

message AcceptedDiagnostic {
  oneof detail {
    option (buf.validate.oneof).required = true;

    kent.api.shared.InternalFailureDetails prompt_history_failure = 1;
    kent.api.shared.InternalFailureDetails internal_failure = 2;
  }
}

message InputAccepted {
  QueueItemIdentity queue_item = 1 [(buf.validate.field).required = true];
  optional AcceptedDiagnostic diagnostic = 2;
}

message InputNotAccepted {
  oneof reason {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty canceled = 1;
    RuntimeUnavailableDetails runtime_unavailable = 2;
    PendingWorkCapacityDetails pending_work_capacity = 3;
    kent.api.prompt_command.CatalogReadDetails prompt_catalog_read = 4;
    kent.api.prompt_command.CommandNotFoundDetails prompt_command_not_found = 5;
    kent.api.prompt_command.CommandReadDetails prompt_command_read = 6;
    kent.api.shared.InternalFailureDetails internal_failure = 7;
  }
}

message InputMutationSuccess {
  ExistingSessionTarget session = 1 [(buf.validate.field).required = true];
  oneof outcome {
    option (buf.validate.oneof).required = true;

    InputAccepted accepted = 2;
    InputNotAccepted not_accepted = 3;
  }
}

message ChatOperationError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.chat_settings.SessionNotFoundDetails session_not_found = 2 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "session_not_found"
      }
    ];
    kent.api.chat_settings.WorkspaceNotRegisteredDetails workspace_not_registered = 3 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "workspace_not_registered"
      }
    ];
    kent.api.chat_settings.AgentPreparationDetails chat_settings_agent_preparation = 4 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "chat_settings_agent_preparation"
      }
    ];
    kent.api.shared.InternalFailureDetails internal_failure = 5 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "internal_failure"
      }
    ];
    kent.api.auth.AuthRequiredDetails auth_required = 6 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "auth_required"
      }
    ];
    kent.api.server.ServerNotReadyDetails server_not_ready = 7 [
      (kent.api.shared.kent_result_field) = {
        role: RESULT_FIELD_ROLE_ERROR_DETAIL
        error_code: "server_not_ready"
      }
    ];
  }
}

message SteerResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    InputMutationSuccess success = 1 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS
    ];
    ChatOperationError error = 2 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR
    ];
  }
}

message QueueResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    InputMutationSuccess success = 1 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS
    ];
    ChatOperationError error = 2 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR
    ];
  }
}

message SteerRequest {
  ChatTarget target = 1 [(buf.validate.field).required = true];
  Activation activation = 2 [(buf.validate.field).required = true];
}

message QueueRequest {
  ChatTarget target = 1 [(buf.validate.field).required = true];
  Activation activation = 2 [(buf.validate.field).required = true];
}

message ManualCompactionTooSoonDetails {}

message ManualCompactionDisabledDetails {}

message ManualCompactionActiveDetails {}

message CompactionAccepted {
  CompactionRequestIdentity request = 1 [(buf.validate.field).required = true];
  optional AcceptedDiagnostic diagnostic = 2;
}

message CompactionNotAccepted {
  oneof reason {
    option (buf.validate.oneof).required = true;

    google.protobuf.Empty canceled = 1;
    RuntimeUnavailableDetails runtime_unavailable = 2;
    PendingWorkCapacityDetails pending_work_capacity = 3;
    ManualCompactionTooSoonDetails too_soon = 4;
    ManualCompactionDisabledDetails disabled = 5;
    ManualCompactionActiveDetails active = 6;
    kent.api.shared.InternalFailureDetails internal_failure = 7;
  }
}

message CompactionMutationSuccess {
  ExistingSessionTarget session = 1 [(buf.validate.field).required = true];
  oneof outcome {
    option (buf.validate.oneof).required = true;

    CompactionAccepted accepted = 2;
    CompactionNotAccepted not_accepted = 3;
  }
}

message CompactResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;

    CompactionMutationSuccess success = 1 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS
    ];
    ChatOperationError error = 2 [
      (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR
    ];
  }
}

message CompactRequest {
  ChatTarget target = 1 [(buf.validate.field).required = true];
  CompactionInvocation invocation = 2 [(buf.validate.field).required = true];
}

service ChatService {
  rpc Steer(SteerRequest) returns (SteerResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_CHAT_TARGET
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_DEDICATED
    };
  }
  rpc Queue(QueueRequest) returns (QueueResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_CHAT_TARGET
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_DEDICATED
    };
  }
  rpc Compact(CompactRequest) returns (CompactResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY
      authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_CHAT_TARGET
      direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_DEDICATED
    };
  }
}
