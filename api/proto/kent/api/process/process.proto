syntax = "proto3";

package kent.api.process;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kent/api/shared/foundation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/process;processpb";

message BackgroundProcess {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string owner_session_id = 2 [(buf.validate.field).string.min_len = 1];
  string owner_run_id = 3 [(buf.validate.field).string.min_len = 1];
  string owner_step_id = 4 [(buf.validate.field).string.min_len = 1];
  string state = 5 [(buf.validate.field).string.min_len = 1];
  string command = 6;
  string workdir = 7 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp started_at = 8 [(buf.validate.field).required = true];
  optional google.protobuf.Timestamp finished_at = 9;
  optional int32 exit_code = 10;
  string log_path = 11;
  bool output_available = 12;
  int64 output_retained_from_bytes = 13 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9007199254740991
  }];
  int64 output_retained_to_bytes = 14 [(buf.validate.field).int64 = {
    gte: 0
    lte: 9007199254740991
  }];
  bool running = 15;
  bool stdin_open = 16;
  bool backgrounded = 17;
  bool kill_requested = 18;
  google.protobuf.Timestamp last_updated_at = 19 [(buf.validate.field).required = true];
  string recent_output = 20;

  option (buf.validate.message).cel = {
    id: "kent.process.retained_range"
    message: "retained output end must not precede its start"
    expression: "this.output_retained_to_bytes >= this.output_retained_from_bytes"
  };
}

message ListRequest {
  optional string owner_session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string owner_run_id = 2 [(buf.validate.field).string.min_len = 1];
  string project_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.process.list_project_id_nonblank"
      message: "project_id must not be blank"
      expression: "this.trim() != ''"
    }
  ];
}

message ListSuccess {
  repeated BackgroundProcess processes = 1 [(buf.validate.field).repeated.items.required = true];
}

message GetRequest {
  string process_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.process.get_process_id_nonblank"
      message: "process_id must not be blank"
      expression: "this.trim() != ''"
    }
  ];
}

message GetSuccess {
  optional BackgroundProcess process = 1;
}

message KillRequest {
  string process_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.process.kill_process_id_nonblank"
      message: "process_id must not be blank"
      expression: "this.trim() != ''"
    }
  ];
}

message InlineOutputRequest {
  string process_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.process.inline_output_process_id_nonblank"
      message: "process_id must not be blank"
      expression: "this.trim() != ''"
    }
  ];
  int32 max_chars = 2;
}

message InlineOutputSuccess {
  string log_path = 1;
}

message ListError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message GetError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message KillError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message InlineOutputError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message ListResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ListSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    ListError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message GetResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    GetSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    GetError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message KillResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    KillError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message InlineOutputResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    InlineOutputSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    InlineOutputError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

service ViewService {
  rpc List(ListRequest) returns (ListResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY authentication_stage: AUTHENTICATION_STAGE_PRE_SERVER
      scope_policy: SCOPE_POLICY_PROJECT_VIEW direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED legacy_wire_name: "process.list"
    };
  }
  rpc Get(GetRequest) returns (GetResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY authentication_stage: AUTHENTICATION_STAGE_PRE_SERVER
      scope_policy: SCOPE_POLICY_PROCESS_ACTIVE_PROJECT direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED legacy_wire_name: "process.get"
    };
  }
}

service ControlService {
  rpc Kill(KillRequest) returns (KillResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_NONE direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED legacy_wire_name: "process.kill"
    };
  }
  rpc InlineOutput(InlineOutputRequest) returns (InlineOutputResult) {
    option (kent.api.shared.kent_method) = {
      kind: OPERATION_KIND_UNARY authentication_stage: AUTHENTICATION_STAGE_SERVER
      scope_policy: SCOPE_POLICY_PROCESS_ACTIVE_PROJECT direction: DIRECTION_CLIENT_TO_SERVER
      unary_connection: UNARY_CONNECTION_MULTIPLEXED legacy_wire_name: "process.inlineOutput"
    };
  }
}
