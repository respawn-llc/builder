      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
  }
}

message SetupStartResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    google.protobuf.Empty success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    SetupStartError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message SetupCompletion {
  // Legacy StreamCompleteParams.message becomes a client-neutral diagnostic.
  // transcript_close_reason is excluded because Worktree setup is not a
  // transcript stream and its completion path never produces that fact.
  optional int32 code = 1;
  optional string diagnostic = 2 [(buf.validate.field).string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "kent.worktree.setup_completion"
    message: "setup completion code and diagnostic must be present together and code must be non-zero"
    expression:
      "(!has(this.code) && !has(this.diagnostic)) || "
      "(has(this.code) && this.code != 0 && has(this.diagnostic))"
  };
}

