syntax = "proto3";

package kent.api.worktree;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "kent/api/auth/auth.proto";
import "kent/api/project/project.proto";
import "kent/api/server/server.proto";
import "kent/api/shared/foundation.proto";
import "kent/api/shared/validation.proto";

option go_package = "core/shared/protoapi/gen/kent/api/worktree;worktreepb";

enum TopologyVariant {
  WORKTREE_TOPOLOGY_VARIANT_UNSPECIFIED = 0;
  WORKTREE_TOPOLOGY_VARIANT_MAIN_WORKSPACE = 1;
  WORKTREE_TOPOLOGY_VARIANT_REGISTERED = 2;
  WORKTREE_TOPOLOGY_VARIANT_EXTERNAL = 3;
  WORKTREE_TOPOLOGY_VARIANT_MISSING = 4;
}

enum SwitchOperationKind {
  WORKTREE_SWITCH_OPERATION_UNSPECIFIED = 0;
  WORKTREE_SWITCH_OPERATION_ENTER = 1;
  WORKTREE_SWITCH_OPERATION_LEAVE_MAIN = 2;
}

enum StatusProblemKind {
  WORKTREE_STATUS_PROBLEM_UNSPECIFIED = 0;
  WORKTREE_STATUS_PROBLEM_ROOT_MISSING = 1;
  WORKTREE_STATUS_PROBLEM_ROOT_INACCESSIBLE = 2;
  WORKTREE_STATUS_PROBLEM_GIT_BINDING_MISSING = 3;
  WORKTREE_STATUS_PROBLEM_GIT_BINDING_MISMATCHED = 4;
  WORKTREE_STATUS_PROBLEM_RECORDED_REF_MISSING = 5;
}

enum DirtyStateKind {
  DIRTY_STATE_UNSPECIFIED = 0;
  DIRTY_STATE_CLEAN = 1;
  DIRTY_STATE_DIRTY = 2;
  DIRTY_STATE_UNKNOWN = 3;
}

enum BranchCleanupMode {
  WORKTREE_BRANCH_CLEANUP_MODE_UNSPECIFIED = 0;
  WORKTREE_BRANCH_CLEANUP_MODE_RETAIN = 1;
  WORKTREE_BRANCH_CLEANUP_MODE_AUTO_IF_KENT_CREATED = 2;
  WORKTREE_BRANCH_CLEANUP_MODE_DELETE_SAFE = 3;
  WORKTREE_BRANCH_CLEANUP_MODE_DELETE_FORCE = 4;
}

enum BranchCleanupOutcomeKind {
  WORKTREE_BRANCH_CLEANUP_OUTCOME_UNSPECIFIED = 0;
  WORKTREE_BRANCH_CLEANUP_OUTCOME_NOT_REQUESTED = 1;
  WORKTREE_BRANCH_CLEANUP_OUTCOME_NOT_APPLICABLE = 2;
  WORKTREE_BRANCH_CLEANUP_OUTCOME_DELETED = 3;
  WORKTREE_BRANCH_CLEANUP_OUTCOME_RETAINED = 4;
}

enum CreateTargetResolutionKind {
  WORKTREE_CREATE_TARGET_RESOLUTION_KIND_UNSPECIFIED = 0;
  WORKTREE_CREATE_TARGET_RESOLUTION_KIND_NEW_BRANCH = 1;
  WORKTREE_CREATE_TARGET_RESOLUTION_KIND_EXISTING_BRANCH = 2;
  WORKTREE_CREATE_TARGET_RESOLUTION_KIND_DETACHED_REF = 3;
}

enum SelectorErrorKind {
  WORKTREE_SELECTOR_ERROR_KIND_UNSPECIFIED = 0;
  WORKTREE_SELECTOR_ERROR_KIND_NOT_FOUND = 1;
  WORKTREE_SELECTOR_ERROR_KIND_AMBIGUOUS = 2;
  WORKTREE_SELECTOR_ERROR_KIND_UNAVAILABLE = 3;
}

enum CreateErrorOwner {
  WORKTREE_CREATE_ERROR_OWNER_UNSPECIFIED = 0;
  WORKTREE_CREATE_ERROR_OWNER_BASE_REF = 1;
  WORKTREE_CREATE_ERROR_OWNER_FORM = 2;
}

enum SetupNotRequiredReason {
  WORKTREE_SETUP_NOT_REQUIRED_REASON_UNSPECIFIED = 0;
  WORKTREE_SETUP_NOT_REQUIRED_REASON_NO_TARGET_PREPARATION = 1;
  WORKTREE_SETUP_NOT_REQUIRED_REASON_NO_CONFIGURED_SCRIPT = 2;
}

enum SetupRetryReadiness {
  WORKTREE_SETUP_RETRY_READINESS_UNSPECIFIED = 0;
  WORKTREE_SETUP_RETRY_READY = 1;
  WORKTREE_SETUP_NON_RETRYABLE = 2;
}

enum SetupExecutionTargetMode {
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_UNSPECIFIED = 0;
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_NONE = 1;
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_HEAD = 2;
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_DEFAULT_BRANCH = 3;
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_CUSTOM_REF = 4;
  WORKTREE_SETUP_EXECUTION_TARGET_MODE_ASK_ON_FIRST_EXECUTION = 5;
}

message GitFacts {
  string canonical_root = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string head_object = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string branch_ref = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string branch_name = 4 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  bool detached = 5;
  bool bare = 6;
  optional string locked_reason = 7 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string prunable_reason = 8 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  bool is_main_worktree = 9;
  bool path_available = 10;
}

message KentFacts {
  string worktree_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string canonical_root = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string display_name = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  bool managed = 4;
  bool created_branch = 5;
  optional string origin_session_id = 6 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message RegisteredFacts {
  GitFacts git = 1 [(buf.validate.field).required = true];
  KentFacts kent = 2 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.registered_roots"
    message: "registered Git and Kent canonical roots must match"
    expression: "this.git.canonical_root == this.kent.canonical_root"
  };
}

message MainWorkspaceFacts {
  GitFacts git = 1 [(buf.validate.field).required = true];
}

message ExternalFacts {
  GitFacts git = 1 [(buf.validate.field).required = true];
}

message MissingFacts {
  KentFacts kent = 1 [(buf.validate.field).required = true];
}

message TopologyEntry {
  oneof topology {
    option (buf.validate.oneof).required = true;
    MainWorkspaceFacts main_workspace = 1;
    RegisteredFacts registered = 2;
    ExternalFacts external = 3;
    MissingFacts missing = 4;
  }
}

message SwitchOperation {
  SwitchOperationKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string selector = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.switch_selector"
    message: "enter requires selector and leave_main forbids selector"
    expression:
      "(this.kind == 1 && has(this.selector)) || "
      "(this.kind == 2 && !has(this.selector))"
  };
}

message DeletePreviewOperation {
  string selector = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message ListProjection {
  string selector = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  bool is_current = 2;
  optional SwitchOperation switch = 3;
  optional DeletePreviewOperation delete_preview = 4;
  optional string fallback_identity = 5 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message ListEntry {
  TopologyEntry topology = 1 [(buf.validate.field).required = true];
  ListProjection projection = 2 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.list_entry_switch"
    message: "worktree switch projection must match topology and selector"
    expression:
      "!has(this.projection.switch) || "
      "(!this.projection.is_current && "
      "((has(this.topology.main_workspace) && this.topology.main_workspace.git.path_available && "
      "this.projection.switch.kind == 2 && !has(this.projection.switch.selector)) || "
      "(has(this.topology.registered) && this.topology.registered.git.path_available && "
      "this.projection.switch.kind == 1 && "
      "this.projection.switch.selector == this.projection.selector) || "
      "(has(this.topology.external) && this.topology.external.git.path_available && "
      "this.projection.switch.kind == 1 && "
      "this.projection.switch.selector == this.projection.selector)))"
    };
  option (buf.validate.message).cel = {
    id: "kent.worktree.list_entry_delete_preview"
    message: "worktree delete preview projection must match topology"
    expression:
      "!has(this.projection.delete_preview) || "
      "(has(this.topology.registered) && !this.topology.registered.git.is_main_worktree && "
      "this.projection.delete_preview.selector == this.topology.registered.kent.worktree_id) || "
      "(has(this.topology.external) && !this.topology.external.git.is_main_worktree && "
      "this.projection.delete_preview.selector == this.topology.external.git.canonical_root) || "
      "(has(this.topology.missing) && "
      "this.projection.delete_preview.selector == this.topology.missing.kent.worktree_id)"
  };
  option (buf.validate.message).cel = {
    id: "kent.worktree.list_entry_fallback"
    message: "fallback identity is present only for an unnamed external worktree"
    expression:
      "has(this.projection.fallback_identity) == "
      "(has(this.topology.external) && !has(this.topology.external.git.branch_name))"
  };
}

message SessionExecutionWorktreeTarget {
  string id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string name = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string root = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  kent.api.project.ProjectAvailability availability = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message SessionExecutionTarget {
  string workspace_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string workspace_name = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string workspace_root = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  kent.api.project.ProjectAvailability workspace_availability = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional SessionExecutionWorktreeTarget worktree = 5;
  string cwd_relpath = 6 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string effective_workdir = 7 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message StatusProblem {
  StatusProblemKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string root = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string ref = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.status_problem_payload"
    message: "status problem payload must match its kind"
    expression:
      "(this.kind in [1, 2, 3, 4] && has(this.root) && !has(this.ref)) || "
      "(this.kind == 5 && !has(this.root) && has(this.ref))"
  };
}

message StatusTarget {
  string recorded_root = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string observed_root = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string display_name = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string recorded_branch_ref = 4 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string observed_branch_ref = 5 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message DirtyState {
  DirtyStateKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional int32 dirty_file_count = 2 [(buf.validate.field).int32.gt = 0];
  optional string unknown_cause = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.dirty_state_payload"
    message: "dirty state payload must match its kind"
    expression:
      "(this.kind == 1 && !has(this.dirty_file_count) && !has(this.unknown_cause)) || "
      "(this.kind == 2 && has(this.dirty_file_count) && !has(this.unknown_cause)) || "
      "(this.kind == 3 && !has(this.dirty_file_count) && has(this.unknown_cause))"
  };
}

message BranchCleanupOutcome {
  BranchCleanupOutcomeKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string branch_name = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional string diagnostic = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.branch_cleanup_payload"
    message: "branch cleanup payload must match its kind"
    expression:
      "(this.kind in [1, 2] && !has(this.branch_name) && !has(this.diagnostic)) || "
      "(this.kind == 3 && has(this.branch_name) && !has(this.diagnostic)) || "
      "(this.kind == 4 && has(this.branch_name))"
  };
}

message ScheduledAcknowledgement {
  string operation_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
}

message SelectorCandidate {
  TopologyVariant variant = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string selector = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.worktree.selector_candidate_selector_nonblank"
      message: "selector must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string branch_name = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.worktree.selector_candidate_branch_nonblank"
      message: "branch_name must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  optional string display_name = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.worktree.selector_candidate_display_name_nonblank"
      message: "display_name must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
  string fallback_identity = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "kent.worktree.selector_candidate_fallback_identity_nonblank"
      message: "fallback_identity must be non-blank"
      expression: "this.trim() != ''"
    }
  ];
}

message SelectorErrorDetails {
  SelectorErrorKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string input = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  repeated SelectorCandidate candidates = 3;

  option (buf.validate.message).cel = {
    id: "kent.worktree.selector_error_candidates"
    message: "only ambiguous selector errors contain candidates"
    expression:
      "(this.kind == 2 && size(this.candidates) > 0) || "
      "(this.kind in [1, 3] && size(this.candidates) == 0)"
  };
}

message SetupRetainedDetails {
  RegisteredFacts worktree = 1 [(buf.validate.field).required = true];
  string script_path = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string diagnostic = 3 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  optional RetainedPreviousWorktree retained_previous_worktree = 4;
}

message DeletePreconditionDetails {
  DirtyState dirty_state = 1 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.delete_precondition_not_clean"
    message: "delete precondition cannot contain a clean state"
    expression: "this.dirty_state.kind != 1"
  };
}

message CreateFailureDetails {
  CreateErrorOwner owner = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string diagnostic = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message BlockedDetails {}

message PendingWorkCapacityDetails {}

message StatusRequest {
  string session_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message StatusSuccess {
  SessionExecutionTarget target = 1 [(buf.validate.field).required = true];
  StatusTarget worktree = 2 [(buf.validate.field).required = true];
  repeated StatusProblem problems = 3;
}

message StatusError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.auth.AuthRequiredDetails auth_required = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];
    kent.api.server.ServerNotReadyDetails server_not_ready = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}

message StatusResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    StatusSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    StatusError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message ListRequest {
  string session_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message ListSuccess {
  SessionExecutionTarget target = 1 [(buf.validate.field).required = true];
  repeated ListEntry worktrees = 2;

  option (buf.validate.message).cel = {
    id: "kent.worktree.session_list_projection"
    message: "session worktree projections must expose every eligible operation"
    expression:
      "this.worktrees.all(w, "
      "has(w.projection.switch) == "
      "(!w.projection.is_current && "
      "((has(w.topology.main_workspace) && w.topology.main_workspace.git.path_available) || "
      "(has(w.topology.registered) && w.topology.registered.git.path_available) || "
      "(has(w.topology.external) && w.topology.external.git.path_available))) && "
      "has(w.projection.delete_preview) == "
      "((has(w.topology.registered) && !w.topology.registered.git.is_main_worktree) || "
      "(has(w.topology.external) && !w.topology.external.git.is_main_worktree) || "
      "has(w.topology.missing)))"
  };
}

message ListError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.auth.AuthRequiredDetails auth_required = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];
    kent.api.server.ServerNotReadyDetails server_not_ready = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}

message ListResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    ListSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    ListError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message WorkspaceListRequest {
  string project_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string workspace_id = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message WorkspaceListSuccess {
  string workspace_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  repeated ListEntry worktrees = 2;

  option (buf.validate.message).cel = {
    id: "kent.worktree.workspace_list_projection"
    message: "workspace worktree projections cannot expose session operations"
    expression:
      "this.worktrees.all(w, !w.projection.is_current && "
      "!has(w.projection.switch) && !has(w.projection.delete_preview))"
  };
}

message WorkspaceListError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    kent.api.shared.InternalFailureDetails internal_failure = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.project.WorkspaceNotRegisteredDetails workspace_not_registered = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "workspace_not_registered"
    }];
    kent.api.auth.AuthRequiredDetails auth_required = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];
    kent.api.server.ServerNotReadyDetails server_not_ready = 5 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "server_not_ready"
    }];
  }
}

message WorkspaceListResult {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    WorkspaceListSuccess success = 1 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_SUCCESS];
    WorkspaceListError error = 2 [(kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR];
  }
}

message SelectorResolveRequest {
  string session_id = 1 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
  string selector = 2 [(buf.validate.field).string.(kent.api.shared.nonblank) = true];
}

message SelectorResolveSuccess {
  ListEntry worktree = 1 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "kent.worktree.selector_resolve_projection"
    message: "resolved worktree must expose every eligible session operation"
    expression:
      "has(this.worktree.projection.switch) == "
      "(!this.worktree.projection.is_current && "
      "((has(this.worktree.topology.main_workspace) && this.worktree.topology.main_workspace.git.path_available) || "
      "(has(this.worktree.topology.registered) && this.worktree.topology.registered.git.path_available) || "
      "(has(this.worktree.topology.external) && this.worktree.topology.external.git.path_available))) && "
      "has(this.worktree.projection.delete_preview) == "
      "((has(this.worktree.topology.registered) && !this.worktree.topology.registered.git.is_main_worktree) || "
      "(has(this.worktree.topology.external) && !this.worktree.topology.external.git.is_main_worktree) || "
      "has(this.worktree.topology.missing))"
  };
}

message SelectorResolveError {
  string code = 1 [
    (buf.validate.field).string.min_len = 1,
    (kent.api.shared.kent_result_field).role = RESULT_FIELD_ROLE_ERROR_CODE
  ];
  oneof detail {
    SelectorErrorDetails selector_error = 2 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "selector_error"
    }];
    kent.api.shared.InternalFailureDetails internal_failure = 3 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "internal_failure"
    }];
    kent.api.auth.AuthRequiredDetails auth_required = 4 [(kent.api.shared.kent_result_field) = {
      role: RESULT_FIELD_ROLE_ERROR_DETAIL
      error_code: "auth_required"
    }];
