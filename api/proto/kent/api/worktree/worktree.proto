message RetainedPreviousWorktree {
  RegisteredFacts worktree = 1 [(buf.validate.field).required = true];
}

message SetupExecutionTargetSelection {
  SetupExecutionTargetMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string custom_ref = 2 [(buf.validate.field).string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "kent.worktree.setup_execution_target"
    message: "custom_ref is present only for custom-ref mode"
    expression:
      "(this.mode == 4 && has(this.custom_ref)) || "
      "(this.mode != 4 && !has(this.custom_ref))"
  };
}

message SetupStarted {
  string source_workspace_root = 1 [(buf.validate.field).string.min_len = 1];
  string worktree_root = 2 [(buf.validate.field).string.min_len = 1];
  string script_path = 3 [(buf.validate.field).string.min_len = 1];
}

message SetupCompleted {
  optional RetainedPreviousWorktree retained_previous_worktree = 1;
}

message SetupNotRequired {
  SetupNotRequiredReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional RetainedPreviousWorktree retained_previous_worktree = 2;
}

message SetupProcessExit {
  int32 exit_code = 1;
  optional string stdout = 2;
  optional string stderr = 3;

  option (buf.validate.message).cel = {
    id: "kent.worktree.setup_exit_code"
    message: "process exit code must be non-zero"
    expression: "this.exit_code != 0"
  };
}

message SetupTimeout {
  optional string stdout = 1;
  optional string stderr = 2;
}

message SetupFailureCause {
  oneof cause {
    option (buf.validate.oneof).required = true;
    SetupProcessExit process_exit = 1;
    SetupTimeout timeout = 2;
    google.protobuf.Empty target_preparation = 3;
    google.protobuf.Empty interruption_persistence = 4;
    google.protobuf.Empty canceled = 5;
    google.protobuf.Empty controller_shutdown = 6;
    google.protobuf.Empty operational = 7;
  }
}

message SetupFailed {
  SetupRetryReadiness retry_readiness = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  SetupFailureCause cause = 2 [(buf.validate.field).required = true];
  string diagnostic = 3 [(buf.validate.field).string.min_len = 1];
  optional string script_path = 4 [(buf.validate.field).string.min_len = 1];
  optional SetupExecutionTargetSelection execution_target = 5;
  optional RegisteredFacts retained_worktree = 6;
  optional RetainedPreviousWorktree retained_previous_worktree = 7;

  option (buf.validate.message).cel = {
    id: "kent.worktree.setup_failure_readiness"
    message: "setup failure retry readiness must match its cause"
    expression:
      "((has(this.cause.process_exit) || has(this.cause.timeout) || has(this.cause.target_preparation)) && this.retry_readiness == 1) || "
      "((has(this.cause.interruption_persistence) || has(this.cause.canceled) || has(this.cause.controller_shutdown)) && this.retry_readiness == 2) || "
      "has(this.cause.operational)"
  };
  option (buf.validate.message).cel = {
    id: "kent.worktree.setup_failure_retained_facts"
    message: "retry-ready setup script failures require script and retained worktree facts"
    expression:
      "(this.retry_readiness != 1) || "
      "(has(this.cause.target_preparation) && !has(this.script_path)) || "
      "(!has(this.cause.target_preparation) && has(this.script_path) && has(this.retained_worktree))"
  };
}

message SetupEvent {
  string setup_operation_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  oneof phase {
    option (buf.validate.oneof).required = true;
    SetupStarted started = 2;
    SetupCompleted completed = 3;
    SetupNotRequired not_required = 4;
    SetupFailed failed = 5;
  }
}

message SetupSubscribeRequest {
