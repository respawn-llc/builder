message WorkflowNode {
  string id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string workflow_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string key = 3 [(buf.validate.field).string.min_len = 1];
  NodeKind kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string display_name = 5 [(buf.validate.field).string.min_len = 1];
  optional string group_id = 6 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string group_key = 7;
  optional string subagent_role = 8 [(buf.validate.field).string.min_len = 1];
  optional CompletionMode completion_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string script_path = 10 [(buf.validate.field).string.min_len = 1];
  repeated JoinInputProvider join_input_providers = 11 [(buf.validate.field).repeated.max_items = 200];

  option (buf.validate.message).cel = {
    id: "kent.workflow_definition.workflow_node_kind_fields"
    message: "node-specific fields must match the node kind"
    expression:
      "(this.kind == 2 || (!has(this.completion_mode) && !has(this.subagent_role))) && "
      "(this.kind == 3 || !has(this.script_path)) && "
      "(this.kind == 4 || size(this.join_input_providers) == 0)"
  };
}

