    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  // NFC normalization and the Unicode letter/number plus punctuation alphabet
  // remain owned by the Project label domain boundary; Protovalidate has no
  // equivalent Unicode normalization/category predicate.
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    },
    (buf.validate.field).cel = {
      id: "kent.workflow_definition.project_label_name_nonblank"
      message: "name must not be blank"
      expression: "this.trim() != ''"
    }
  ];
}

message ProjectLabelCatalog {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated ProjectLabel labels = 2 [
    (buf.validate.field).repeated.max_items = 100
  ];

  option (buf.validate.message).cel = {
    id: "kent.workflow_definition.project_label_ids_unique"
    message: "label IDs must be unique"
    expression: "this.labels.map(label, label.id).unique()"
  };
}

message ProjectLabelCatalogRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ProjectLabelCatalogSuccess {
  ProjectLabelCatalog catalog = 1 [(buf.validate.field).required = true];
}

message ProjectLabelCreateRequest {
  string project_id = 1 [(buf.validate.field).string.min_len = 1];
