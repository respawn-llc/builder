  ];
  string transition_group_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  string key = 4 [(buf.validate.field).string.min_len = 1];
  string target_node_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).string.(kent.api.shared.canonical_uuid_v4) = true
  ];
  AssigneeSelection assignee_selection = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ThinkingSelection thinking_selection = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bool requires_approval = 8;
  ContextMode context_mode = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ContextSource context_source = 10 [(buf.validate.field).required = true];
  string prompt_template = 11;
  repeated Parameter parameters = 12 [(buf.validate.field).repeated.max_items = 200];
  repeated InputBinding input_bindings = 13 [(buf.validate.field).repeated.max_items = 200];
  repeated OutputRequirement output_requirements = 14 [(buf.validate.field).repeated.max_items = 200];

  option (buf.validate.message).cel = {
    id: "kent.workflow_definition.edge_parameter_keys_unique"
    message: "parameter keys and protected purposes must be unique"
    expression:
      "this.parameters.map(parameter, parameter.key).unique() && "
      "this.parameters.filter(parameter, parameter.purpose != 1).map(parameter, parameter.purpose).unique()"
  };
