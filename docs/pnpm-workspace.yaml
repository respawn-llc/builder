allowBuilds:
  esbuild: true
  sharp: true

# starlight-llms-txt eagerly creates an Astro container at module load even when
# rawContent is enabled, which makes Astro 7 validate nested deprecated Markdown
# defaults during route generation. Keep the patch scoped to this release until
# upstream lazy-initializes the container or accepts Astro 7's processor config.
patchedDependencies:
  starlight-llms-txt@0.11.0: patches/starlight-llms-txt@0.11.0.patch
