    schema:
      - "../../server/metadata/lifecycle.sql"
    queries:
      - "../../server/metadata/lifecycle.sql"
    gen:
      go:
        package: "sqlitelifecyclegen"
        out: "sqlitelifecyclegen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_interface: false
