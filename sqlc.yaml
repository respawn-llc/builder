version: "2"
sql:
  - engine: "sqlite"
    schema:
      - "server/metadata/migrations/*.up.sql"
      - "server/metadata/sqlc/*.sql"
    queries:
      - "server/metadata/queries.sql"
    gen:
      go:
        package: "sqlitegen"
        out: "server/metadata/sqlitegen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "BLOB"
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
          - db_type: "BLOB"
            nullable: true
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
              pointer: true
          - column: "project_default_workflow_identity.workflow_id"
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
              pointer: true
