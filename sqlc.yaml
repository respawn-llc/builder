# `go generate ./server/metadata/sqlitegen` renders the temporary query input.
version: "2"
sql:
  - engine: "sqlite"
    schema:
      - "server/metadata/migrations/*.up.sql"
      - "server/metadata/sqlc/*.sql"
    queries:
      - "server/metadata/queries.sql"
    gen:
      go:
        package: "sqlitegen"
        out: "server/metadata/sqlitegen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_interface: false
        overrides:
          - db_type: "BLOB"
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
          - db_type: "BLOB"
            nullable: true
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
              pointer: true
          - column: "workflow_nodes.group_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_node_groups.id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_nodes.id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_transition_groups.id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_transition_groups.source_node_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_edges.id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_edges.transition_group_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "workflow_edges.target_node_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "task_current_nodes.node_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "task_current_nodes.entered_by_edge_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "task_pending_approvals.source_node_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "session_workflow_node_associations.node_id"
            go_type:
              import: "database/sql"
              type: "RawBytes"
          - column: "project_default_workflow_identity.workflow_id"
            go_type:
              import: "core/shared/runtimeids"
              type: "WorkflowID"
              pointer: true
