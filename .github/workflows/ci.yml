name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/pnpm-lock.yaml
            docs/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/desktop/src-tauri
      - uses: extractions/setup-just@v3
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 file build-essential ripgrep
      - name: Prepare repository dependencies
        run: just install _dependencies
      - name: Run the full active suite
        run: just check default --dry-run

  frozen-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: tui-rs
      - uses: extractions/setup-just@v3
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run the explicit frozen Rust suite
        run: just check rust --dry-run

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: extractions/setup-just@v3
      - run: just setup
      - run: just install _docs-dependencies
      - run: just build go
      - run: just test tui
      - run: just lint docs --dry-run
      - run: just build docs
      - name: Build installer fixtures
        run: just release _cli-build --version 0.0.0 --dist-dir dist
      - name: Smoke test Windows installer
        run: just release _windows-installer-smoke --version 0.0.0 --goarch amd64 --dist-dir dist

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/desktop/src-tauri
      - uses: extractions/setup-just@v3
      - run: just install _apps-dependencies
      - run: just build desktop -- --bundles dmg
      - run: just build _desktop-smoke-macos --bundle-dir apps/desktop/src-tauri/target/release/bundle/dmg
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-bundle-macos-arm64
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
