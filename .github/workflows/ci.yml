name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: tui-rs

      - name: Run Rust lints
        run: |
          cargo install cargo-deny --locked
          just lint rust --dry-run

      - name: Run server lint
        run: just lint server --dry-run

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      - name: Build
        run: just build go

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install GUI dependencies
        run: just install _apps-dependencies

      - name: Test
        run: |
          just test server --no-wall-clock-cap
          just test desktop

  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v3

      - name: Build mocked Windows release assets
        env:
          VERSION: 0.0.0
        run: |
          mkdir -p dist staging
          : > dist/checksums.txt
          for goarch in amd64 arm64; do
            asset="kent_${VERSION}_windows_${goarch}"
            GOOS=windows GOARCH="$goarch" KENT_VERSION="$VERSION" \
              just build _go --output "staging/${asset}.exe"
            powershell -NoProfile -Command "Compress-Archive -LiteralPath 'staging/${asset}.exe' -DestinationPath 'dist/${asset}.zip' -Force"
            checksum=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath 'dist/${asset}.zip').Hash.ToLowerInvariant()")
            printf '%s  %s\n' "$checksum" "${asset}.zip" >> dist/checksums.txt
          done

      - name: Smoke test installer
        env:
          VERSION: 0.0.0
        run: just release _windows-installer-smoke --version "$VERSION" --goarch amd64 --dist-dir dist

      - name: Smoke test installer restores stopped service after failure
        env:
          VERSION: 0.0.0
        run: |
          cat > fake-kent.go <<'GO'
          package main
          import (
            "fmt"
            "os"
            "strings"
          )
          func mark(value string) {
            path := os.Getenv("KENT_FAKE_MARKER")
            if path == "" { return }
            f, err := os.OpenFile(path, os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644)
            if err == nil { _, _ = f.WriteString(value + "\n"); _ = f.Close() }
          }
          func main() {
            args := os.Args[1:]
            if len(args) == 1 && args[0] == "--version" { fmt.Println(os.Getenv("KENT_FAKE_VERSION")); return }
            if len(args) >= 2 && args[0] == "service" && args[1] == "status" {
              exe, _ := os.Executable()
              fmt.Printf(`{"installed":true,"loaded":true,"running":true,"command":[%q],"endpoint":"","logs":[]}`+"\n", exe)
              return
            }
            if len(args) >= 2 && args[0] == "service" && args[1] == "stop" { mark("stopped"); return }
            if len(args) >= 3 && strings.Join(args[:3], " ") == "service restart --if-installed" { mark("restarted"); return }
            fmt.Fprintf(os.Stderr, "unexpected args: %v\n", args)
            os.Exit(1)
          }
          GO
          mkdir -p "recovery-release/v${VERSION}" "recovery-install" "recovery-staging"
          GOOS=windows GOARCH=amd64 go build -o recovery-install/kent.exe fake-kent.go
          cp recovery-install/kent.exe "recovery-staging/kent_${VERSION}_windows_amd64.exe"
          powershell -NoProfile -Command "Compress-Archive -LiteralPath 'recovery-staging/kent_${VERSION}_windows_amd64.exe' -DestinationPath 'recovery-release/v${VERSION}/kent_${VERSION}_windows_amd64.zip' -Force"
          checksum=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath 'recovery-release/v${VERSION}/kent_${VERSION}_windows_amd64.zip').Hash.ToLowerInvariant()")
          printf '%s  %s\n' "$checksum" "kent_${VERSION}_windows_amd64.zip" > "recovery-release/v${VERSION}/checksums.txt"
          release_base="$(cygpath -w "$PWD/recovery-release")"
          install_dir="$(cygpath -w "$PWD/recovery-install")"
          marker_path="$PWD/recovery-marker.txt"
          marker_win="$(cygpath -w "$marker_path")"
          if KENT_RELEASE_BASE="$release_base" KENT_FAKE_MARKER="$marker_win" KENT_FAKE_VERSION="wrong" \
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 \
              -Version "$VERSION" -InstallDir "$install_dir" -Yes -NoPath -NoDeps; then
            echo "installer unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q '^stopped$' "$marker_path"
          grep -q '^restarted$' "$marker_path"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - uses: extractions/setup-just@v3

      - name: Install docs dependencies
        run: just install _docs-dependencies

      - name: Check docs
        run: just check docs --dry-run

  gui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - uses: extractions/setup-just@v3

      - name: Install GUI dependencies
        run: just install _apps-dependencies

      - name: Generate GUI contracts
        run: just _gen-typescript

      - name: Lint GUI
        run: just lint desktop --dry-run

      - name: Test GUI
        run: just test desktop

      - name: Build GUI web assets
        run: just build _desktop-web

  gui-native:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - uses: extractions/setup-just@v3

      - name: Install GUI dependencies
        run: just install _apps-dependencies

      - name: Build macOS desktop bundle
        run: just build desktop -- --bundles dmg

      - name: Smoke test macOS desktop bundle
        run: just build _desktop-smoke-macos apps/desktop/src-tauri/target/release/bundle/dmg

      - name: Upload macOS desktop bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-bundle-macos-arm64
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  desktop_bundle:
    # Catch desktop packaging breakage (bundling, AppImage/deb generation, updater
    # artifact signing) on PRs — gui-native only cargo-checks the Rust shell. Linux
    # only: it is the cheap runner and the most common packaging break; the macOS
    # .dmg/glass-icon path is validated by the release job + first-bundle manual QA.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 file build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - uses: extractions/setup-just@v3

      - name: Install GUI dependencies
        run: just install _apps-dependencies

      # The desktop build signs updater artifacts (createUpdaterArtifacts is on). PRs
      # (incl. forks) have no secret, so mint a throwaway key and pass it by content.
      # The signer runs under pnpm --dir apps/desktop, so the key path must be
      # absolute ($RUNNER_TEMP); the signed debug artifacts are discarded.
      - name: Build desktop bundle (unsigned, debug)
        run: just build _desktop-ci-debug "$RUNNER_TEMP/ci-updater.key"
