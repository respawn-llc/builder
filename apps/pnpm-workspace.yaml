packages:
  - "desktop"
  - "desktop/packages/*"
  - "shared/*"

# 7 days. Keeps freshly published packages out of local installs/updates.
minimumReleaseAge: 10080

# No frontend dependency may run install/build lifecycle scripts unless explicitly reviewed here.
onlyBuiltDependencies: []

# PNPM 11 requires an explicit decision for ignored lifecycle scripts.
allowBuilds:
  msw: false
  # The resolver ships platform bindings as optional dependencies. Its postinstall
  # fallback is unnecessary for the supported workspace toolchains.
  unrs-resolver: false
